apiVersion: v1
kind: Service
metadata:
  name: {{ include "wanderbound.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wanderbound.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "wanderbound.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8000
      protocol: TCP
      targetPort: 8000
