apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "wanderbound.configName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wanderbound.labels" . | nindent 4 }}
data:
  DATA_FOLDER: /data
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
